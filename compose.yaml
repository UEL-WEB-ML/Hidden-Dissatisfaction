services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HD_APP_RUNTIME_PASSWORD: ${HD_APP_RUNTIME_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./data/raw/olist:/data/raw/olist:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  migrate:
    image: ${POSTGRES_IMAGE}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - ./infra/postgres/migrations:/migrations:ro
      - ./infra/postgres/migrate.sh:/usr/local/bin/hd-migrate:ro
    entrypoint: ["bash", "/usr/local/bin/hd-migrate"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    environment:
      # Container-to-container DNS is used here; the host URL in .env is for local tools.
      HD_DATABASE_URL: postgresql+asyncpg://app_api:${HD_APP_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HD_JWT_SECRET: ${HD_JWT_SECRET}
      HD_EVIDENCE_DIR: /var/lib/hidden-dissatisfaction/evidence
      HD_CORS_ORIGINS: ${HD_CORS_ORIGINS:-[]}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - evidence_data:/var/lib/hidden-dissatisfaction/evidence
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend/prototype
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-4200}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  warehouse:
    build:
      context: .
      dockerfile: infra/jobs/Dockerfile
    profiles: [jobs]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DBT_HOST: postgres
      DBT_PORT: 5432
      DBT_USER: ${DBT_USER:-postgres}
      DBT_PASSWORD: ${DBT_PASSWORD:-${POSTGRES_SUPERUSER_PASSWORD}}
      DBT_DATABASE: ${POSTGRES_DB}
      DBT_SOURCE_RUN_ID: ${DBT_SOURCE_RUN_ID:-}
    command:
      - sh
      - -ec
      - >-
        test -n "$${DBT_SOURCE_RUN_ID}" ||
        { echo "DBT_SOURCE_RUN_ID is required" >&2; exit 1; };
        exec dbt build --exclude tag:release_only
        --project-dir dbt --profiles-dir dbt
        --vars "{source_run_id: $${DBT_SOURCE_RUN_ID}}"

volumes:
  postgres_data:
  evidence_data:
