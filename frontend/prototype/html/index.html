<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk Queue · Hidden Dissatisfaction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="topbar" id="topbar"></nav>

  <div class="page" id="content">
    <h1>Risk Queue</h1>
    <p class="sub" data-vi="Đơn giao đúng hạn nhưng vẫn có thể bị đánh giá 1–2 sao, xếp theo thứ tự ưu tiên.">Orders delivered on time that may still get a 1–2 star review, in priority order.</p>

    <!-- F02-S01: Summary banner -->
    <div id="banner"></div>

    <!-- F03: Search and Filter. 4 ô hay dùng luôn hiện, phần còn lại nằm trong "More filters" -->
    <div class="box filters" id="filters">
      <div class="f-row compact">
        <label class="f-search"><span data-vi="Mã đơn hoặc mã sản phẩm">Order or product ID</span>
          <input id="f-q" type="search" placeholder="e.g. a3f9c1e2" data-vi-ph="vd: a3f9c1e2" autocomplete="off" oninput="onSearch()" aria-describedby="q-msg">
          <span class="f-msg" id="q-msg" aria-live="polite"></span>
        </label>
        <button class="btn f-toggle" type="button" id="f-toggle" aria-expanded="false" aria-controls="f-rest" onclick="toggleFilters()">Filters</button>
        <div class="f-rest" id="f-rest">
        <label><span data-vi="Mức rủi ro">Risk level</span>
          <select id="f-level" onchange="applyFilters()">
            <option value="" data-vi="Tất cả">All</option>
            <option value="HIGH">HIGH</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="LOW">LOW</option>
          </select>
        </label>
        <label><span data-vi="Trạng thái">Status</span>
          <select id="f-status" onchange="applyFilters()">
            <option value="OPEN" data-vi="Đang mở (mặc định)">Open (default)</option>
            <option value="" data-vi="Tất cả">All</option>
            <option value="PENDING" data-vi="Chờ nhận">Pending</option>
            <option value="IN_PROGRESS" data-vi="Đang xử lý">In progress</option>
            <option value="COMPLETED" data-vi="Hoàn tất">Completed</option>
            <option value="SKIPPED" data-vi="Bỏ qua">Skipped</option>
          </select>
        </label>
        <label>SLA
          <select id="f-sla" onchange="applyFilters()">
            <option value="" data-vi="Tất cả">All</option>
            <option value="over" data-vi="Quá hạn">Overdue</option>
            <option value="soon" data-vi="Sắp hạn">Due soon</option>
            <option value="esc" id="opt-esc">Escalated</option>
            <option value="stale" id="opt-stale">No update</option>
          </select>
        </label>
        <button class="btn more-btn" type="button" id="more-btn" aria-expanded="false" aria-controls="more-panel" onclick="toggleMore()">More filters</button>
        <button class="btn" type="button" onclick="resetFilters()" data-vi="Đặt lại">Reset</button>
        </div>
      </div>
      <div class="more-panel" id="more-panel" hidden>
        <div class="f-row">
          <label><span data-vi="Score từ">Score from</span>
            <input id="f-smin" type="number" min="0" max="1" step="0.05" placeholder="0" onchange="applyFilters()">
          </label>
          <label><span data-vi="đến">to</span>
            <input id="f-smax" type="number" min="0" max="1" step="0.05" placeholder="1" onchange="applyFilters()">
          </label>
          <label><span data-vi="Vào queue từ">Queued from</span>
            <input id="f-from" type="date" onchange="applyFilters()">
          </label>
          <label><span data-vi="đến">to</span>
            <input id="f-to" type="date" onchange="applyFilters()">
          </label>
          <label><span data-vi="Người phụ trách">Assignee</span>
            <select id="f-assignee" onchange="applyFilters()">
              <option value="" data-vi="Tất cả">All</option>
              <option value="me" data-vi="Tôi">Me</option>
              <option value="none" data-vi="Chưa ai nhận">Unassigned</option>
            </select>
          </label>
          <label>Seller
            <select id="f-seller" onchange="applyFilters()"><option value="" data-vi="Tất cả">All</option></select>
          </label>
          <label><span data-vi="Ngành hàng">Category</span>
            <select id="f-category" onchange="applyFilters()"><option value="" data-vi="Tất cả">All</option></select>
          </label>
          <label><span data-vi="Kết quả">Outcome</span>
            <select id="f-outcome" onchange="applyFilters()"><option value="" data-vi="Tất cả">All</option></select>
          </label>
        </div>
      </div>
    </div>

    <!-- F03-S04: chip filter đang áp dụng -->
    <div class="chips" id="chips" aria-live="polite"></div>

    <!-- Tab (chỉ Specialist) + số đơn + sắp xếp trên cùng một hàng -->
    <div class="list-head">
      <div class="tabs-bar" role="tablist" id="queue-tabs"></div>
      <div class="toolbar">
        <span id="count"></span>
        <label><span data-vi="Sắp xếp">Sort by</span>
          <select id="f-sort" onchange="applyFilters()" title="Priority = risk score high → low, then SLA due soonest, then longest in queue"
            data-vi-title="Ưu tiên = score cao → thấp, rồi SLA gần hạn, rồi nằm queue lâu">
            <option value="" data-vi="Ưu tiên (mặc định)">Priority (default)</option>
            <option value="sla" data-vi="SLA gần hạn nhất">SLA due soonest</option>
            <option value="aging" data-vi="Nằm queue lâu nhất">Longest in queue</option>
          </select>
        </label>
      </div>
    </div>

    <!-- F02-S02: bảng (màn rộng) -->
    <div class="box queue-table" id="queue-table">
      <table>
        <thead>
          <tr>
            <th data-vi="Mã đơn">Order ID</th>
            <th id="th-score"><button type="button" class="th-sort" onclick="setSort('')">Risk score</button></th>
            <th data-vi="Mức">Level</th>
            <th data-vi="Sản phẩm cần kiểm tra">Product to check</th>
            <th id="th-aging"><button type="button" class="th-sort" onclick="setSort('aging')">Aging</button></th>
            <th id="th-sla"><button type="button" class="th-sort" onclick="setSort('sla')">SLA</button></th>
            <th data-vi="Trạng thái">Status</th>
            <th data-vi="Người phụ trách">Assignee</th>
            <th data-vi="Thao tác">Action</th>
          </tr>
        </thead>
        <tbody id="queue-body"></tbody>
      </table>
    </div>

    <!-- Thẻ: màn hẹp (dưới 768px bảng ẩn đi, thẻ hiện ra) -->
    <div class="cards" id="queue-cards"></div>

    <!-- F02-S05: tải thêm -->
    <div class="load-more" id="load-more"></div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script>
    var PAGE_SIZE = 8;
    var shown = PAGE_SIZE;
    var FILTERS = ["q", "level", "smin", "smax", "status", "outcome", "seller", "category", "from", "to", "assignee", "sla", "sort"];
    var MORE = ["smin", "smax", "from", "to", "assignee", "seller", "category", "outcome"];   // nằm trong "More filters"
    var DEFAULTS = { status: "OPEN" };
    var ITEM_ID = /^[0-9a-f]{32}-\d{1,3}$/;

    function el(id) { return document.getElementById(id); }
    function val(k) { return el("f-" + k).value; }

    // ---------- Đổ lựa chọn cho các ô lọc (GET /orders/filter-options, GET /users) ----------
    async function fillOptions() {
      var r = await Promise.all([api.getFilterOptions(), api.listUsers("SPECIALIST")]);
      var sellers = r[0].sellers, cats = r[0].categories, sp = r[1].items;
      for (var s = 0; s < sellers.length; s++) el("f-seller").innerHTML += '<option value="' + escapeHtml(sellers[s]) + '">' + escapeHtml(shortId(sellers[s])) + "</option>";
      for (var c = 0; c < cats.length; c++) el("f-category").innerHTML += '<option value="' + escapeHtml(cats[c]) + '">' + escapeHtml(catLabel(cats[c])) + "</option>";
      for (var k in OUTCOME_LABEL) el("f-outcome").innerHTML += '<option value="O:' + k + '">' + L("Completed – ", "Hoàn tất – ") + OUTCOME_LABEL[k] + "</option>";
      for (var q in SKIP_LABEL) el("f-outcome").innerHTML += '<option value="S:' + q + '">' + L("Skipped – ", "Bỏ qua – ") + SKIP_LABEL[q] + "</option>";
      for (var u = 0; u < sp.length; u++) el("f-assignee").innerHTML += '<option value="' + escapeHtml(sp[u].user_id) + '">' + escapeHtml(sp[u].full_name) + "</option>";
    }

    // ---------- Bộ lọc ↔ địa chỉ trang ----------
    function readUrl() {
      var p = new URLSearchParams(location.search);
      for (var i = 0; i < FILTERS.length; i++) {
        var k = FILTERS[i];
        el("f-" + k).value = p.get(k) != null ? p.get(k) : (DEFAULTS[k] || "");
      }
    }
    function writeUrl() {
      var p = new URLSearchParams();
      for (var i = 0; i < FILTERS.length; i++) {
        var k = FILTERS[i], v = val(k);
        if (v != (DEFAULTS[k] || "")) p.set(k, v);
      }
      var q = p.toString();
      history.replaceState(null, "", location.pathname + (q ? "?" + q : ""));
    }

    function applyFilters() { shown = PAGE_SIZE; writeUrl(); render(); }
    function setSort(v) { el("f-sort").value = v; applyFilters(); }

    // ---------- "More filters" ----------
    function moreCount() {
      var n = 0;
      for (var i = 0; i < MORE.length; i++) if (val(MORE[i]) != "") n++;
      return n;
    }
    function toggleMore(open) {
      var panel = el("more-panel");
      if (open == null) open = panel.hidden;
      panel.hidden = !open;
      el("more-btn").setAttribute("aria-expanded", open);
    }
    function renderMoreBtn() {
      var n = moreCount();
      el("more-btn").innerHTML = L("More filters", "Lọc thêm") + (n ? '<span class="n">' + n + "</span>" : "");
      // Nút "Filters" (chỉ hiện trên màn hẹp): số filter đang bật, trừ ô tìm và trạng thái mặc định
      var all = 0;
      for (var i = 0; i < FILTERS.length; i++) if (FILTERS[i] != "q" && FILTERS[i] != "sort" && val(FILTERS[i]) != (DEFAULTS[FILTERS[i]] || "")) all++;
      el("f-toggle").innerHTML = L("Filters", "Bộ lọc") + (all ? '<span class="n">' + all + "</span>" : "");
    }
    // Màn hẹp: bộ lọc gập lại sau nút "Filters", chỉ ô tìm luôn hiện
    function toggleFilters() {
      var box = el("filters"), open = !box.classList.contains("open");
      box.classList.toggle("open", open);
      el("f-toggle").setAttribute("aria-expanded", open);
    }

    // Tab "My orders" = filter Assignee = Me; "All" = bỏ filter đó.
    function setTab(mine) { el("f-assignee").value = mine ? "me" : ""; applyFilters(); }
    function renderTabs() {
      if (isManager()) { el("queue-tabs").style.display = "none"; return; }
      var mine = val("assignee") == "me";
      el("queue-tabs").innerHTML =
          '<button type="button" role="tab" aria-selected="' + !mine + '"' + (mine ? "" : ' class="active"') + ' onclick="setTab(false)">' + L("All", "Tất cả") + "</button>"
        + '<button type="button" role="tab" aria-selected="' + mine + '"' + (mine ? ' class="active"' : "") + ' onclick="setTab(true)">' + L("My orders", "Đơn của tôi") + ' <span class="tab-count">'
        + ME.active_count + "/" + config.capacity + "</span></button>";
    }
    function resetFilters() {
      for (var i = 0; i < FILTERS.length; i++) el("f-" + FILTERS[i]).value = DEFAULTS[FILTERS[i]] || "";
      applyFilters();
    }
    function clearFilter(k) { el("f-" + k).value = DEFAULTS[k] || ""; applyFilters(); }

    // F03-S01: kiểm tra định dạng mã đơn / mã sản phẩm
    function onSearch() {
      var q = val("q").trim().toLowerCase();
      el("f-q").value = q;
      applyFilters();
    }
    function searchError() {
      var q = val("q");
      if (q == "" || ITEM_ID.test(q)) return "";
      var head = q.split("-")[0];
      if (q.indexOf("-") != -1 && (head.length != 32 || !/^[0-9a-f]+$/.test(head))) return L("Invalid format: a product ID is the full 32-character order ID followed by -1, -2…", "Sai định dạng: mã sản phẩm là đủ 32 ký tự mã đơn kèm -1, -2…");
      if (q.indexOf("-") != -1) return L("Invalid format: add the item number after the dash, e.g. -1.", "Sai định dạng: thêm số thứ tự sản phẩm sau dấu gạch, vd -1.");
      if (!/^[0-9a-f]*$/.test(q)) return L("Invalid format: an order ID only contains digits 0-9 and letters a-f.", "Sai định dạng: mã đơn chỉ gồm số 0-9 và chữ a-f.");
      if (q.length > 32) return L("Invalid format: an order ID is 32 characters long.", "Sai định dạng: mã đơn dài 32 ký tự.");
      return "";
    }

    // ---------- Lọc: gửi lên backend (GET /orders), tên tham số = tên ô lọc ----------
    function query() {
      var q = {};
      for (var i = 0; i < FILTERS.length; i++) q[FILTERS[i]] = val(FILTERS[i]);
      return q;
    }

    // Tiêu đề cột: mũi tên + aria-sort chỉ ở cột đang dùng để sắp xếp
    function renderSortHeaders() {
      var cols = { "": ["th-score", "Risk score", "descending", "▼"], aging: ["th-aging", "Aging", "descending", "▼"], sla: ["th-sla", "SLA", "ascending", "▲"] };
      for (var k in cols) {
        var th = el(cols[k][0]), on = val("sort") == k;
        if (on) th.setAttribute("aria-sort", cols[k][2]); else th.removeAttribute("aria-sort");
        th.querySelector("button").innerHTML = cols[k][1] + (on ? ' <span aria-hidden="true">' + cols[k][3] + "</span>" : "");
      }
    }

    // ---------- Chip filter (F03-S04) ----------
    function renderChips() {
      var names = { q: L("ID", "Mã"), level: L("Level", "Mức"), smin: "Score ≥", smax: "Score ≤", status: L("Status", "Trạng thái"), outcome: L("Outcome", "Kết quả"),
        seller: "Seller", category: L("Category", "Ngành hàng"), from: L("From", "Từ"), to: L("To", "Đến"), assignee: L("Assignee", "Người phụ trách"), sla: "SLA", sort: L("Sort", "Sắp xếp") };
      var html = "";
      for (var i = 0; i < FILTERS.length; i++) {
        var k = FILTERS[i], v = val(k);
        if (v == (DEFAULTS[k] || "")) continue;
        var sel = el("f-" + k);
        var text = sel.tagName == "SELECT" ? sel.options[sel.selectedIndex].text : (k == "seller" ? shortId(v) : v);
        html += '<span class="chip">' + names[k] + ": <b>" + text + '</b> <button type="button" aria-label="' + L("Remove filter ", "Bỏ lọc ") + names[k]
          + '" onclick="clearFilter(\'' + k + '\')">×</button></span>';
      }
      if (html != "") html += '<a href="#" onclick="resetFilters(); return false;">' + L("Clear all", "Xóa hết") + "</a>";
      el("chips").innerHTML = html;
    }

    // ---------- Hành động theo vai + trạng thái (F02-S04) ----------
    // Trong bảng chỉ dùng nút viền; nút đậm duy nhất là "Claim" ở banner "Start with".
    var ORDERS = {};   // đơn đang hiện trên màn, tra theo order_id cho hộp thoại assign
    function actionCell(c) {
      var link = 'order.html?id=' + c.order_id;
      if (isManager()) {
        if (c.status == "PENDING") return '<button class="btn sm" onclick="assignOrder(\'' + encodeURIComponent(c.order_id).replace(/'/g, "%27") + '\')">' + L("Assign", "Giao đơn") + "</button>";
        if (c.status == "IN_PROGRESS") return '<button class="btn sm" onclick="assignOrder(\'' + encodeURIComponent(c.order_id).replace(/'/g, "%27") + '\')">' + L("Reassign", "Chuyển người") + "</button>";
        return '<a class="btn sm" href="' + link + '">' + L("View", "Xem") + "</a>";
      }
      if (c.status == "PENDING" && !c.self_claim_allowed) {
        // BRD 6.3 mục 1: HIGH chỉ Manager giao
        return '<span class="lock-tag" title="' + L("HIGH-risk orders are assigned by a manager", "Đơn HIGH do Manager giao") + '">' + L("Manager assigns", "Chờ Manager giao") + "</span>";
      }
      if (c.status == "PENDING") {
        var full = ME.active_count >= config.capacity;
        return '<button class="btn sm" onclick="claim(\'' + encodeURIComponent(c.order_id).replace(/'/g, "%27") + '\')"' + (full ? ' disabled title="' + L("You already hold " + config.capacity + " orders", "Bạn đang giữ đủ " + config.capacity + " đơn") + '"' : "") + ">" + L("Claim", "Nhận") + "</button>";
      }
      if (c.status == "IN_PROGRESS" && c.assignee_id == ME.user_id) return '<a class="btn sm" href="attempt.html?id=' + encodeURIComponent(c.order_id).replace(/'/g, "%27") + '">' + L("Continue", "Làm tiếp") + "</a>";
      return '<a class="btn sm" href="' + link + '">' + L("View", "Xem") + "</a>";
    }
    function assignOrder(id) { openAssign(ORDERS[id], refresh); }

    // "Sản phẩm cần kiểm tra": sản phẩm có score cao nhất trong đơn (FRD F02-S02)
    function productCell(c) {
      var t = c.top_item, more = c.items_count - 1;
      return '<div class="prod">' + escapeHtml(catLabel(t.category)) + (t.synthetic_data_flag ? " " + synthTag() : "") + "</div>"
        + '<div class="tiny prod-sub"><span class="id">' + shortItemId(t.product_item_id) + "</span> · " + escapeHtml(t.risk_level) + " " + t.risk_score.toFixed(2)
        + (more > 0 ? ' · <span class="more-items">' + L("+" + more + " more", "+" + more + " sản phẩm") + "</span>" : "") + "</div>";
    }

    // POST /orders/{id}/claim. 409 = người khác nhận trước, 422 = đã đủ capacity, 403 = đơn HIGH (API_CONTRACT 4.5)
    async function claim(id) {
      try {
        var r = await api.claim(id);
        var n = r.me.active_count, msg = L("Claimed order " + shortId(id) + ". You now hold " + n + "/" + config.capacity + ".", "Đã nhận đơn " + shortId(id) + ". Bạn đang giữ " + n + "/" + config.capacity + ".");
        if (n >= config.capacity) msg += L(" Limit reached: complete or skip an order before claiming another.", " Đã đủ: hoàn tất hoặc bỏ qua một đơn rồi mới nhận thêm.");
        else if (n >= config.capacity_warn) msg += L(" Almost at the limit: " + r.me.slots_left + " slot left.", " Sắp đủ: còn " + r.me.slots_left + " slot.");
        toast(msg, n >= config.capacity_warn ? "warn" : "ok");
      } catch (e) {
        toast(e.code == "ALREADY_CLAIMED" ? e.message + L(" The list has been refreshed.", " Danh sách đã được tải lại.") : e.message, "error");
      }
      refresh();
    }

    // ---------- Summary banner (F02-S01): GET /orders/summary ----------
    async function renderBanner() {
      el("banner").innerHTML = '<div class="banner"><div class="b-cell sk-block">' + skeletonHtml(2) + '</div><div class="b-cell wide sk-block">'
        + skeletonHtml(3) + '</div><div class="b-cell sk-block">' + skeletonHtml(2) + "</div></div>";
      var s;
      try { s = await api.getQueueSummary(); }
      catch (e) { el("banner").innerHTML = ""; return; }   // lỗi hiện một lần ở vùng danh sách
      var first = s.first_pending;
      if (first) ORDERS[first.order_id] = first;
      var highIcon = '<span class="badge HIGH">' + levelIcon("HIGH") + "</span>";

      var html;
      if (isManager()) {
        html = '<div class="banner kpis five">'
          + kpiCard({ href: "?level=HIGH&status=PENDING", cls: "lead", icon: highIcon, label: L("Pending HIGH", "HIGH chờ giao"), num: s.high_pending,
              sub: s.high_pending_overdue > 0 ? '<b class="hi">' + L(s.high_pending_overdue + " overdue", s.high_pending_overdue + " quá hạn") + "</b>" : L("All within SLA", "Đều còn hạn SLA"), action: L("Assign", "Giao đơn") })
          + kpiCard({ href: "?sla=over", tone: s.overdue ? "danger" : "neutral", icon: "clock", label: L("Overdue SLA", "Quá hạn SLA"), num: s.overdue,
              sub: L("Past the SLA for their level", "Quá SLA theo mức rủi ro"), action: L("View", "Xem") })
          + kpiCard({ href: "?sla=esc", tone: "dark", icon: "up", label: "Escalated", num: s.escalated,
              sub: L("In queue ≥ " + config.aging_days + " days", "Nằm queue ≥ " + config.aging_days + " ngày"), action: L("View", "Xem") })
          + kpiCard({ href: "?sla=stale", tone: "warn", icon: "hourglass", label: L("Stale", "Lâu không cập nhật"), num: s.stale,
              sub: L("In progress, no update ≥ " + durationText(config.stale_hours), "Đang xử lý, ≥ " + durationText(config.stale_hours) + " không cập nhật"), action: L("View", "Xem") })
          + kpiCard({ href: "decision.html", tone: "blue", icon: "gavel", label: L("Needs decision", "Cần quyết định"), num: s.needs_decision,
              sub: L("Closed or out of attempts", "Đã đóng hoặc hết lượt liên lạc"), action: L("Decide", "Ra quyết định") })
          + "</div>";
      } else {
        var n = s.me.active_count, left = s.me.slots_left;
        var capCls = n >= config.capacity ? "full" : (n >= config.capacity_warn ? "warn" : "");
        var capMsg = n >= config.capacity ? L("Limit of " + config.capacity + " reached. Complete or skip an order to claim more.", "Đã đủ " + config.capacity + " đơn. Hoàn tất hoặc bỏ qua một đơn để nhận thêm.")
          : (n >= config.capacity_warn ? L("Almost at the limit of " + config.capacity + ".", "Sắp đủ giới hạn " + config.capacity + " đơn.") : L(left + " slots left to claim.", "Còn " + left + " slot để nhận."));
        var start = first == null ? '<div class="b-label">' + L("No LOW or MEDIUM orders are waiting to be claimed.", "Không còn đơn LOW/MEDIUM nào chờ nhận.") + "</div>"
          : '<div class="b-first">' + idLink(first.order_id, "order.html?id=" + first.order_id) + " "
            + badge(first.risk_level) + " <b>" + first.risk_score.toFixed(2) + "</b> · " + slaBadge(first) + "</div>"
            + '<div class="b-label">' + escapeHtml(catLabel(first.top_item.category)) + " · " + escapeHtml(first.top_factors[0] || L("No explanation yet", "Chưa có giải thích")) + "</div>"
            + '<div class="b-actions"><button class="btn primary sm" onclick="claim(decodeURIComponent(\'' + encodeURIComponent(first.order_id).replace(/'/g, "%27") + '\'))"' + (n >= config.capacity ? " disabled" : "") + ">" + L("Claim", "Nhận") + "</button> "
            + '<a class="btn sm" href="order.html?id=' + encodeURIComponent(first.order_id).replace(/'/g, "%27") + '">' + L("View details", "Xem chi tiết") + "</a></div>";
        // Feedback 13/10: ô "Holding" thành biểu đồ vòng (đã giữ / capacity)
        var holding = '<a class="kpi cap-donut tone-' + (capCls ? "cap-" + capCls : "blue") + '" href="?assignee=me">'
          + '<div class="kpi-head"><span class="kpi-icon">' + icon("inbox") + '</span><span class="kpi-label">' + L("Holding", "Đang giữ") + "</span></div>"
          + '<div class="cd-body">' + donut(n, config.capacity, capCls)
          + '<div class="cd-legend"><div><span class="sw used ' + capCls + '"></span>' + L(n + " in progress", n + " đang xử lý") + "</div>"
          + '<div><span class="sw free"></span>' + L(left + " free", left + " còn trống") + "</div></div></div>"
          + '<div class="kpi-sub">' + capMsg + "</div>"
          + '<div class="kpi-action">' + L("My orders", "Đơn của tôi") + ' <span aria-hidden="true">→</span></div></a>';
        html = '<div class="banner kpis">'
          + kpiCard({ href: "?level=HIGH&status=PENDING", icon: highIcon, label: L("Pending HIGH", "HIGH chờ giao"), num: s.high_pending,
              sub: s.high_pending_overdue > 0 ? '<b class="hi">' + L(s.high_pending_overdue + " overdue", s.high_pending_overdue + " quá hạn") + "</b> · " + L("waiting for a manager", "chờ Manager giao")
                : L("Waiting for a manager to assign", "Chờ Manager giao"), action: L("View", "Xem") })
          + '<div class="b-cell wide lead"><div class="kpi-head"><span class="kpi-icon tone-blue">' + icon("target") + '</span><span class="kpi-label">' + L("Start with", "Nên bắt đầu") + "</span></div>" + start + "</div>"
          + holding
          + "</div>";
      }
      el("banner").innerHTML = html;
    }

    // ---------- Bảng + thẻ ----------
    var reqNo = 0;
    function showLoading() {
      el("count").innerHTML = L("Loading…", "Đang tải…");
      el("load-more").innerHTML = "";
      var sk = "";
      for (var r = 0; r < 5; r++) sk += '<tr aria-hidden="true"><td colspan="9"><div class="sk-line" style="width:' + (96 - r * 7) + '%"></div></td></tr>';
      el("queue-body").innerHTML = sk;
      el("queue-cards").innerHTML = '<div class="card">' + skeletonHtml(3) + '</div><div class="card">' + skeletonHtml(3) + "</div>";
    }

    async function render() {
      renderChips();
      renderTabs();
      renderMoreBtn();
      renderSortHeaders();

      var err = searchError();
      var msg = el("q-msg");
      msg.className = "f-msg" + (err ? " error" : "");
      el("f-q").setAttribute("aria-invalid", err ? "true" : "false");

      var data = { items: [], total: 0 };
      if (!err) {
        var mine = ++reqNo;   // gõ nhanh nhiều ký tự: chỉ lấy kết quả của lần gọi cuối
        if (el("queue-body").children.length == 0 || shown == PAGE_SIZE) showLoading();
        try {
          var q = query();
          q.limit = shown; q.offset = 0;
          data = await api.listOrders(q);   // GET /orders: backend lọc, sắp xếp, phân trang
        } catch (e) {
          if (mine != reqNo) return;
          el("count").innerHTML = "";
          el("load-more").innerHTML = "";
          el("queue-body").innerHTML = '<tr><td colspan="9">' + errorHtml(L("the risk queue", "Risk Queue")) + "</td></tr>";
          el("queue-cards").innerHTML = errorHtml(L("the risk queue", "Risk Queue"));
          return;
        }
        if (mine != reqNo) return;
      }
      var list = data.items;

      // Thông báo cho ô tìm
      var qid = val("q");
      if (err) msg.innerHTML = err;
      else if (qid != "" && data.total == 0) msg.innerHTML = ITEM_ID.test(qid) ? L("No product with this ID in the current filters.", "Không có sản phẩm mã này trong bộ lọc hiện tại.")
        : L("No order starting with \"" + qid + "\" in the current filters.", "Không có đơn nào bắt đầu bằng \"" + qid + "\" trong bộ lọc hiện tại.");
      else if (ITEM_ID.test(qid) && data.total == 1) msg.innerHTML = '<a href="order.html?id=' + encodeURIComponent(list[0].order_id) + "&item=" + encodeURIComponent(qid) + '">' + L("Open this product in its order →", "Mở sản phẩm này trong đơn →") + "</a>";
      else if (qid.length == 32 && data.total == 1) msg.innerHTML = '<a href="order.html?id=' + qid + '">' + L("Open this order →", "Mở đơn này →") + "</a>";
      else msg.innerHTML = "";

      var rows = "", cards = "";
      for (var j = 0; j < list.length; j++) {
        var c = list[j];
        ORDERS[c.order_id] = c;
        var link = "order.html?id=" + encodeURIComponent(c.order_id).replace(/'/g, "%27") + (c.matched_item_id ? "&item=" + encodeURIComponent(c.matched_item_id) : "");
        var who = c.assignee_id ? escapeHtml(c.assignee_name) + (c.assignee_id == ME.user_id ? L(" (you)", " (bạn)") : "") : '<span class="muted">' + L("Unassigned", "Chưa ai nhận") + "</span>";
        var aging = durationText(agingHours(c)) + escBadge(c);
        var st = statusBadge(c.status) + (outcomeText(c) ? '<div class="tiny">' + outcomeText(c) + "</div>" : "")
          + (isStale(c) ? '<div class="tiny warn-text">' + L("No update for ≥&nbsp;", "≥&nbsp;") + durationText(config.stale_hours) + L("", " không cập nhật") + "</div>" : "");
        rows += '<tr class="' + c.risk_level + (isClosed(c) ? " done" : "") + '">'
          + "<td>" + idLink(c.order_id, link) + "</td>"
          + '<td class="num"><b class="score">' + c.risk_score.toFixed(2) + '</b><span class="mini"><div style="width:' + (c.risk_score * 100) + '%"></div></span></td>'
          + "<td>" + badge(c.risk_level) + "</td>"
          + "<td>" + productCell(c) + "</td>"
          + '<td class="num">' + aging + "</td>"
          + "<td>" + slaBadge(c) + "</td>"
          + "<td>" + st + "</td>"
          + "<td>" + who + "</td>"
          + "<td>" + actionCell(c) + "</td>"
          + "</tr>";
        cards += '<div class="card ' + c.risk_level + '">'
          + '<div class="row c-top">' + badge(c.risk_level) + " <b>" + c.risk_score.toFixed(2) + "</b> " + statusBadge(c.status) + "</div>"
          + '<div class="row">' + idLink(c.order_id, link) + "</div>"
          + '<div class="row">' + productCell(c) + "</div>"
          + '<dl class="c-meta"><dt>SLA</dt><dd>' + slaBadge(c) + "</dd><dt>Aging</dt><dd>" + aging + "</dd><dt>" + L("Assignee", "Phụ trách") + "</dt><dd>" + who + "</dd></dl>"
          + '<div class="row">' + actionCell(c) + "</div>"
          + "</div>";
      }
      if (list.length == 0) {
        var empty = (err ? L("Fix the ID to search.", "Sửa lại mã để tìm.") : L("No orders match these filters.", "Không có đơn nào khớp bộ lọc.")) + ' <a href="#" onclick="resetFilters(); return false;">' + L("Reset filters", "Đặt lại bộ lọc") + "</a>";
        rows = '<tr><td colspan="9" class="empty">' + empty + "</td></tr>";
        cards = '<div class="card empty">' + empty + "</div>";
      }
      el("queue-body").innerHTML = rows;
      el("queue-cards").innerHTML = cards;
      el("count").innerHTML = L("Showing <b>" + list.length + "</b> of " + data.total, "Đang hiện <b>" + list.length + "</b>/" + data.total);
      el("load-more").innerHTML = data.total > list.length
        ? '<button class="btn" onclick="loadMore(this)">' + L("Load more (" + (data.total - list.length) + " left)", "Tải thêm (còn " + (data.total - list.length) + ")") + "</button>"
        : (list.length > 0 ? '<span class="muted">' + L("End of list.", "Hết danh sách.") + "</span>" : "");
    }

    // F02-S05: tải thêm, giữ lọc/sắp xếp
    function loadMore(btn) {
      shown += PAGE_SIZE;
      btn.disabled = true;
      btn.innerHTML = L("Loading…", "Đang tải…");
      render();
    }

    // Sau mỗi thao tác: nạp lại người dùng (số đơn đang giữ), banner, bảng và thanh điều hướng
    async function refresh() {
      try { await reloadMe(); } catch (e) { }
      renderTopbar("queue");
      renderBanner();
      render();
    }

    showLoading();   // hiện khung xám ngay, trong lúc chờ nạp tài khoản và cấu hình
    boot("queue").then(async function () {
      // Nhãn có số lấy từ tham số đang hiệu lực
      el("opt-esc").innerHTML = L("Escalated (≥ " + config.aging_days + " days)", "Escalation (≥ " + config.aging_days + " ngày)");
      el("opt-stale").innerHTML = L("No update ≥ " + durationText(config.stale_hours), "≥ " + durationText(config.stale_hours) + " không cập nhật");
      renderBanner();
      // Đổ lựa chọn trước rồi mới đọc filter trên địa chỉ trang, không thì ô seller/assignee chưa có option để chọn
      try { await fillOptions(); } catch (e) { /* ô lọc phụ để trống, bảng vẫn chạy */ }
      readUrl();
      toggleMore(moreCount() > 0);   // drill-down từ Dashboard có filter "ẩn" thì mở sẵn panel
      render();
    }).catch(function () { });
  </script>
</body>
</html>
