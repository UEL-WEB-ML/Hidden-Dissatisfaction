name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --extra dev --extra ml --extra api
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy src tests
      - run: uv run pytest --cov=hidden_dissatisfaction --cov-report=term-missing
      - name: Domain and application coverage gate
        run: uv run pytest tests/unit tests/contract -q --cov=hidden_dissatisfaction.domain --cov=hidden_dissatisfaction.application --cov-fail-under=100

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/static-quality.sh
      - name: Run frontend security regression checks
        run: node frontend/prototype/security-regression-check.js
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build and start Compose frontend/API stack
        run: |
          docker compose up -d --build api frontend
      - name: Run Compose frontend/API smoke
        run: tests/smoke.sh
      - if: always()
        run: docker compose down -v

  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --extra db --extra api --extra dev
      - run: cp .env.example .env
      - run: docker compose up -d postgres
      - run: make migrate
      - name: Run PostgreSQL adapter integration tests
        run: |
          set -a
          . ./.env
          set +a
          export SETUP_DSN="host=127.0.0.1 port=$POSTGRES_PORT dbname=$POSTGRES_DB user=$POSTGRES_SUPERUSER password=$POSTGRES_SUPERUSER_PASSWORD"
          export RUNTIME_DSN="host=127.0.0.1 port=$POSTGRES_PORT dbname=$POSTGRES_DB user=app_api password=$HD_APP_RUNTIME_PASSWORD"
          export BRONZE_TEST_DSN="$SETUP_DSN"
          export P6_TEST_POSTGRES_DSN="$SETUP_DSN"
          export P9_TEST_POSTGRES_DSN="$SETUP_DSN"
          export P9_APP_RUNTIME_DSN="$RUNTIME_DSN"
          uv run pytest tests/integration/test_postgres_bronze_ingestion.py tests/integration/test_postgres_release_scoring.py tests/integration/test_postgres_parameters.py tests/integration/test_postgres_workflow.py -q
      - if: always()
        run: docker compose down -v

  p4-release-verify:
    name: P4 release verification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DBT_HOST: ${{ secrets.DBT_HOST }}
      DBT_PORT: ${{ secrets.DBT_PORT }}
      DBT_USER: ${{ secrets.DBT_USER }}
      DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
      DBT_DATABASE: ${{ secrets.DBT_DATABASE }}
      DBT_TARGET_SCHEMA: ${{ secrets.DBT_TARGET_SCHEMA }}
      DBT_SOURCE_RUN_ID: ${{ secrets.DBT_SOURCE_RUN_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --extra warehouse
      - name: Require release-gate contract
        run: |
          test -n "$DBT_USER" || { echo "DBT_USER secret is required" >&2; exit 1; }
          test -n "$DBT_PASSWORD" || { echo "DBT_PASSWORD secret is required" >&2; exit 1; }
          test -n "$DBT_SOURCE_RUN_ID" || { echo "DBT_SOURCE_RUN_ID secret is required" >&2; exit 1; }
      - run: make p4-release-verify
