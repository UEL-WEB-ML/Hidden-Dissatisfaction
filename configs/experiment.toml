[project]
name = "olist-hidden-dissatisfaction"
random_seed = 42
prediction_time = "order_delivered_customer_date"

[cohort]
delivered_status = "delivered"
on_time_operator = "<="
low_review_scores = [1, 2]
require_observed_review_for_primary_outcome = true

[validation]
strategy = "rolling_origin"
time_column = "order_delivered_customer_date"
# Initial fixed boundaries for the reproducible baseline. Revisit only through a committed
# config change after validating monthly counts from the rebuilt order-level dataset.
validation_start = "2018-01-01T00:00:00"
test_start = "2018-04-01T00:00:00"
test_end = "2018-09-01T00:00:00"
rolling_folds = 3

[evaluation]
primary_metric = "average_precision"
report_metrics = [
    "average_precision",
    "roc_auc",
    "minority_precision",
    "minority_recall",
    "minority_f1",
    "brier_score",
]
budgets = [0.05, 0.10, 0.20]
bootstrap_iterations = 1000

[models]
baselines = ["prevalence", "logistic_regression", "random_forest"]
candidates = ["hist_gradient_boosting"]
default_resampling = "none"
calibration_methods = ["sigmoid", "isotonic"]
