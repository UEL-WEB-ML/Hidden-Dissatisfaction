[project]
name = "olist-hidden-dissatisfaction"
random_seed = 42
prediction_time = "prediction_at"

[cohort]
delivered_status = "delivered"
on_time_operator = "<="
low_review_scores = [1, 2]
require_observed_review_for_primary_outcome = true

[validation]
strategy = "rolling_origin"
time_column = "prediction_at"
# Initial fixed boundaries for the reproducible baseline. Revisit only through a committed
# config change after validating monthly counts from the rebuilt p5-item-v1 dataset.
train_end = "2017-10-01T00:00:00"
selection_end = "2017-12-01T00:00:00"
calibration_fit_end = "2018-02-01T00:00:00"
calibration_compare_end = "2018-04-01T00:00:00"
threshold_end = "2018-06-01T00:00:00"
test_end = "2018-09-01T00:00:00"
rolling_folds = 3

[evaluation]
primary_metric = "order_max_v1_pr_auc"
report_metrics = [
    "average_precision",
    "roc_auc",
    "minority_precision",
    "minority_recall",
    "minority_f1",
    "brier_score",
]
budgets = [0.05, 0.10, 0.20]
bootstrap_iterations = 1000

[features]
# E00 baseline. S1 experiments must add groups explicitly, one wave at a time.
enabled_groups = ["baseline"]

[models]
# ADR-012: the v3 development selection retains prior baselines and compares a
# bounded native-categorical CatBoost GPU variant. It must not finalize the sealed
# test set before a new selection record is explicitly frozen.
protocol_version = "p5-v5-order-aggregate-challenger"
include_gpu_candidate = true
gpu_device = "0"
families = ["prevalence", "logistic", "random_forest", "hist_gradient_boosting", "catboost_gpu"]
variants = ["prevalence-v1", "logistic-c0_1-v1", "logistic-c1-v1", "random_forest-depth8-leaf5-v1", "random_forest-depth12-leaf10-v1", "hist_gradient_boosting-l2-1-leaf31-v1", "hist_gradient_boosting-l2-5-leaf15-v1", "catboost-gpu-depth8-v1", "catboost-gpu-native-depth8-v2"]
regimes = ["item_unweighted", "order_weight", "order_reference", "order_aggregate"]
default_resampling = "none"
calibration_methods = ["sigmoid", "isotonic"]
n_jobs = 1
