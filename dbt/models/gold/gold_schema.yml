version: 2
models:
  - name: ml_modelling_items
    description: "P4 leakage-safe product-item training mart; one row per source run, order, and order item."
    columns:
      - name: product_item_id
        description: "Authoritative deterministic order-item key: order_id || '-' || order_item_id; source_run_id remains separate lineage scope."
        tests: [not_null, unique]
      - name: prediction_at
        description: "Delivered customer date, the observation cutoff."
        tests: [not_null]
      - name: negative
        description: "1 for canonical review score 1 or 2; review is strictly after prediction_at."
      - name: order_weight
        description: "Inverse number of items in the source order, repeated at item grain."
      - name: feature_set_version
      - name: review_policy_version
        tests:
          - accepted_values:
              values: ['adr-001-latest-answered-v1']
      - name: feature_schema_version
        tests:
          - accepted_values:
              values: ['p5-item-v11-interactions']
      - name: seller_smoothed_negative_rate
        description: "Bayesian seller negative-review rate using only labels observed before prediction_at."
        tests: [not_null]
      - name: category_smoothed_negative_rate
        description: "Bayesian category negative-review rate using only labels observed before prediction_at."
        tests: [not_null]
      - name: target_history_prior_strength
        description: "Frozen Bayesian prior strength used to build this dataset snapshot."
        tests: [not_null]
      - name: observation_window_version
