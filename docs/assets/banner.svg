<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="t d">
  <title id="t">Hidden Dissatisfaction</title>
  <desc id="d">Animated banner: an on-time delivery followed by two glowing red stars out of five.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#bc8cff"/><stop offset="1" stop-color="#ff7b72"/>
    </linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#f85149" stop-opacity=".35"/><stop offset="1" stop-color="#f85149" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".18"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
    <path id="star" d="M0-14 4.1-4.6 14.3-4.3 6.3 2 9 11.8 0 6.2-9 11.8-6.3 2-14.3-4.3-4.1-4.6Z"/>
    <clipPath id="c"><rect width="900" height="280" rx="16"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
    .orb1{animation:d1 9s ease-in-out infinite alternate}
    .orb2{animation:d2 11s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(120px,30px)}}
    @keyframes d2{to{transform:translate(-140px,-20px)}}
    .scan{animation:sc 6s linear infinite}
    @keyframes sc{from{transform:translateX(-300px)}to{transform:translateX(1000px)}}
    .in{opacity:0;animation:in .9s ease-out forwards}
    @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .bad{fill:#f85149;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
    .bad2{animation-delay:.35s}
    @keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 2px #f85149)}50%{transform:scale(1.3);filter:drop-shadow(0 0 12px #f85149)}}
    .ok{fill:#3d4450}
    .truck{animation:run 5s ease-in-out infinite}
    @keyframes run{0%{transform:translateX(0);opacity:0}10%{opacity:1}80%{transform:translateX(300px);opacity:1}100%{transform:translateX(320px);opacity:0}}
    .dash{stroke-dasharray:6 8;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-14}}
    .tick{opacity:0;animation:tick 5s ease-in-out infinite}
    @keyframes tick{0%,70%{opacity:0}80%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <circle class="orb1" cx="150" cy="60" r="220" fill="url(#o1)"/>
    <circle class="orb2" cx="780" cy="240" r="220" fill="url(#o2)"/>
    <rect class="scan" y="0" width="300" height="280" fill="url(#scan)"/>

    <text class="in" x="450" y="100" text-anchor="middle" font-size="54" font-weight="800" fill="url(#ttl)" style="animation-delay:.1s">Hidden Dissatisfaction</text>
    <text class="in" x="450" y="138" text-anchor="middle" font-size="18" fill="#c9d1d9" style="animation-delay:.5s">Predicting 1–2★ reviews on orders delivered <tspan fill="#3fb950" font-weight="700">on time</tspan></text>

    <!-- delivery lane -->
    <g class="in" style="animation-delay:.9s">
      <line class="dash" x1="190" y1="205" x2="500" y2="205" stroke="#58a6ff" stroke-opacity=".6" stroke-width="2"/>
      <g class="truck">
        <rect x="190" y="190" width="22" height="14" rx="2" fill="#58a6ff"/>
        <rect x="212" y="195" width="11" height="9" rx="2" fill="#79c0ff"/>
        <circle cx="198" cy="206" r="3" fill="#0d1117" stroke="#c9d1d9"/><circle cx="217" cy="206" r="3" fill="#0d1117" stroke="#c9d1d9"/>
      </g>
      <text class="tick" x="170" y="236" font-size="13" fill="#3fb950">✓ delivered on time</text>
      <g transform="translate(560 205)">
        <use href="#star" class="bad" x="0" y="0"/>
        <use href="#star" class="bad bad2" x="34" y="0"/>
        <use href="#star" class="ok" x="68" y="0"/>
        <use href="#star" class="ok" x="102" y="0"/>
        <use href="#star" class="ok" x="136" y="0"/>
      </g>
      <text x="630" y="236" text-anchor="middle" font-size="13" fill="#f85149">…yet a 1–2★ review</text>
    </g>
  </g>
</svg>
